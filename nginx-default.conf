# MAF Private Label — nginx server config (container interno).
# O TLS termina no proxy do Easypanel na frente deste container:
# aqui só tratamos roteamento, URLs limpas, gzip e cache.

# Cache do navegador: HTML, JS e CSS sempre revalidam (304 quando não mudou),
# senão quem já visitou segue na versão antiga por dias depois de um deploy
# (em 17/11/2026 isso seguraria o número antigo do WhatsApp). O resto, um dia.
map $sent_http_content_type $cache_regra {
    "~^text/html"                "no-cache";
    "~^text/css"                 "no-cache";
    "~^(application|text)/javascript" "no-cache";
    default                      "public, max-age=86400";
}

# www -> apex (301). O proxy Easypanel repassa o header Host,
# então o bloco abaixo captura as requisições com host www.
server {
    listen 80;
    server_name www.mafprivatelabel.com.br;
    return 301 https://mafprivatelabel.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name mafprivatelabel.com.br _;

    root /usr/share/nginx/html;
    charset utf-8;
    # O TLS termina no proxy: redirect relativo, senão o nginx monta http://
    absolute_redirect off;
    index index.html;

    # URLs limpas: /white-label serve white-label.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Ícones que navegador e iPhone pedem direto na raiz (davam 404)
    location = /favicon.ico { try_files /assets/favicon-32.png =404; }
    location = /apple-touch-icon.png { try_files /assets/apple-touch-icon.png =404; }
    location = /apple-touch-icon-precomposed.png { try_files /assets/apple-touch-icon.png =404; }

    # Endereços que as pessoas e os robôs tentam e que têm página equivalente
    location = /fale-conosco { return 301 /contato; }
    location = /contact { return 301 /contato; }
    location = /about { return 301 /sobre; }
    location = /quem-somos { return 301 /sobre; }
    location = /politica-de-privacidade { return 301 /privacidade; }

    # PDFs de catálogo: sem cache agressivo (o sufixo cd3d79 muda
    # quando o material é trocado — ver PEDIDOS-MAF.md)
    location /materiais/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Assets versionados por nome de arquivo: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Segurança leve sem quebrar o proxy do Easypanel
    add_header Cache-Control $cache_regra always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
